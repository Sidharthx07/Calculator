<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator Madness</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <main class="container flex flex-col mx-auto items-center">

    <h1 class="text-center">Calculate Me!</h1>


    <div class="row">
      <input id="display" class="input" type="text" placeholder="0" />
    </div>


    <div class="wrapper">
      <div class="row">
        <button class="button operator" id="clear">AC</button>
        <button class="button operator">%</button>
        <button class="button operator" id="delete">DEL</button>
        <button class="button operator">/</button>
      </div>
      <div class="row">
        <button class="button">7</button>
        <button class="button">8</button>
        <button class="button">9</button>
        <button class="button operator">*</button>
      </div>
      <div class="row">
        <button class="button">4</button>
        <button class="button">5</button>
        <button class="button">6</button>
        <button class="button operator">-</button>
      </div>
      <div class="row">
        <button class="button">1</button>
        <button class="button">2</button>
        <button class="button">3</button>
        <button class="button operator">+</button>
      </div>
      <div class="row">
        <button class="button">00</button>
        <button class="button">0</button>
        <button class="button">.</button>
        <button class="button equal" id="equal">=</button>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; crafted by Sidharth &#10084;</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
